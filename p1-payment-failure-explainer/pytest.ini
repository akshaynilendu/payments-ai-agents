[pytest]
# Lets tests "import explainer" from the project folder without packaging it.
pythonpath = .
testpaths = tests
# Skipped by default. Run them with: pytest -m integration   /   pytest -m live
markers =
    integration: uses the real embedding model (downloads it once to the local cache)
    live: calls the real Claude API (needs ANTHROPIC_API_KEY in .env.server; costs money)
addopts = -m "not integration and not live"
